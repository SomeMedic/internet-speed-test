[project]
name = "internet-speed-test"
version = "0.1.0"
description = "Simple HTTP download speed test CLI"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
